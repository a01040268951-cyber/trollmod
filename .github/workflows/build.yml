name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build
      - name: smoke test (dedicated server)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt && printf "online-mode=false\n" > run/server.properties
          (timeout 240 ./gradlew runServer --no-daemon > server.log 2>&1 || true)
          echo "=== key log lines ==="
          grep -iE "mixin|trollmod|Done \(|Exception|ERROR|crash|InvalidInjection|Caused by" server.log | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: trollmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
