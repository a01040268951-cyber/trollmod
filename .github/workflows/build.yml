name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build
      - name: smoke test (dedicated server)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt && printf "online-mode=false\n" > run/server.properties
          (timeout 240 ./gradlew runServer --no-daemon > server.log 2>&1 || true)
          echo "=== key log lines ==="
          grep -iE "mixin|trollmod|Done \(|Exception|ERROR|crash|InvalidInjection|Caused by" server.log | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: trollmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 build/libs/trollmod-1.0.0.jar --target main --title "Troll Mod 1.0.0 (Fabric 26.3)" --notes "Fabric API 필요. mods 폴더에 trollmod-1.0.0.jar 와 Fabric API 를 함께 넣으세요."
